name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_e2e:
        description: Provision a real sandbox using the sandbox-e2e environment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: [20, 22, 24]
        include:
          - node: 20
            python: "3.12"
          - node: 22
            python: "3.13"
          - node: 24
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: npm run check
      - run: npm test
      - name: Public Python dependency and import smoke test
        run: uv run --locked --script src/provision.py --check
      - name: provision.py compiles
        run: python3 -m py_compile src/provision.py
      - name: Actions are pinned by sha
        run: |
          if grep -hE '^\s*-?\s*uses:' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}( |$)'; then
            echo "unpinned action above" >&2; exit 1
          fi

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts=--all

  # Put credentials in a GitHub environment with required reviewers.
  # Public contributions run only the credential-free jobs above.
  e2e:
    needs: [test, secrets]
    if: github.event_name == 'workflow_dispatch' && inputs.live_e2e && github.ref == 'refs/heads/main'
    environment: sandbox-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Chalk CLI
        run: |
          curl -fsSL https://api.chalk.ai/install.sh -o "$RUNNER_TEMP/install-chalk.sh"
          sh "$RUNNER_TEMP/install-chalk.sh"
          echo "$HOME/.chalk/bin" >> "$GITHUB_PATH"
      - name: Live sandbox e2e
        env:
          PYTHONFAULTHANDLER: "1"
          CHALK_CLIENT_ID: ${{ secrets.CHALK_CLIENT_ID }}
          CHALK_CLIENT_SECRET: ${{ secrets.CHALK_CLIENT_SECRET }}
          CHALK_ENVIRONMENT: ${{ secrets.CHALK_ENVIRONMENT }}
          CHALK_API_SERVER: ${{ secrets.CHALK_API_SERVER }}
        run: |
          test -n "$CHALK_CLIENT_ID" && test -n "$CHALK_CLIENT_SECRET" && test -n "$CHALK_ENVIRONMENT"
          command -v chalk || export PATH="$HOME/.local/bin:$HOME/.chalk/bin:$PATH"
          chalk version
          npm run e2e
